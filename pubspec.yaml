name: ecomer
description: "ECOMER — Phân hệ admin quản lý người dùng Flutter Web/Android và Firebase."
publish_to: 'none'
version: 0.1.1+2

environment:
  sdk: ^3.13.4

dependencies:
  cloud_firestore: ^7.1.0
  cloud_functions: ^7.0.1
  file_saver: ^0.7.0
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.2
  image_picker: ^1.2.4
  intl: ^0.20.3
  provider: ^6.1.5+1

dev_dependencies:
  firebase_auth_platform_interface: ^9.1.2
  firebase_core_platform_interface: ^8.1.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/mascots/
    - assets/backgrounds/
    - assets/ui_reference/
